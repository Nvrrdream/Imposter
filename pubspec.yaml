name: imposter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.1.0
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.8
  open_filex: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: RubikGemstones
      fonts:
        - asset: assets/fonts/RubikGemstones-Regular.ttf
          weight: 400
  uses-material-design: true
  assets:
    - assets/images/imposter_home_bg.png
    - assets/images/characters/hooded_innocent.webp
    - assets/images/characters/hooded_imposter.webp

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/imposter_launcher.png"
  adaptive_icon_background: "#17151B"
  adaptive_icon_foreground: "assets/images/imposter_launcher.png"
