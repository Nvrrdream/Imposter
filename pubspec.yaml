name: imposter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.1.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: RubikGemstones
      fonts:
        - asset: assets/fonts/RubikGemstones-Regular.ttf
          weight: 400
  uses-material-design: true
  assets:
    - assets/images/imposter_home_bg.png
